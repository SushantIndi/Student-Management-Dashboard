<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../Login/login.css">
</head>

<body>
    <form action="" id="login-form">
        <h1>Login Form</h1>
        <div>
            <div>
                <label for="">Username</label>
                <span id="uerror" class="error"></span>
            </div>
            <input type="text" placeholder="enter the username" id="user">

        </div>
        <div>
            <div>
                <label for="">Password</label>
                <span id="perror" class="error"></span>
            </div>
            <input type="text" placeholder="enter the password" id="pass">
        </div>
        <div id="buttons">
            <button id="login-button">Login</button>
            <button id="cancel-button">Cancel</button>
        </div>
        <div id="register-link">
            <p>Don't have an account?<a href="../Registration/register.html">Register</a></p>
        </div>
    </form>


    <script src="../Login/login.js"></script>
</body>

</html>
