<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0b132b);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: 0;
        }

        body::before {
            background: #3b82f6;
            top: -150px;
            left: -150px;
        }

        body::after {
            background: #22d3ee;
            bottom: -150px;
            right: -150px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #6fffe9;
        }

        .nav-right {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .nav-link {
            color: #cbd5f5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-link:hover {
            color: #38bdf8;
        }

        .nav-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-btn:hover {
            opacity: 0.9;
        }

        .container {
            position: relative;
            background: rgba(15, 23, 42, 0.75);
            padding: 50px 45px;
            border-radius: 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            max-width: 420px;
            animation: floatIn 0.6s ease;
            z-index: 2;
        }

        @keyframes floatIn {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        p.description {
            font-size: 15px;
            color: #cbd5f5;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: 0.25s ease;
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        .time {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="nav-left">
            <span class="logo">Student Dashboard</span>
        </div>

        <div class="nav-right">
            <a href="Login/login.html" class="nav-link">Login</a>
            <a href="Registration/register.html" class="nav-btn">Register</a>
        </div>
    </header>

    <div class="container">
        <h1>🎓 Student Dashboard</h1>
        <p class="description">
            Register, log in, and manage student records with a simple,
            fast, and interactive dashboard powered by JavaScript.
        </p>

        <div class="button-group">
            <a href="Login/login.html" class="btn">Login</a>
            <a href="Registration/register.html" class="btn secondary">Register</a>
        </div>

        <div class="time" id="time"></div>
    </div>

    <script>
        const container = document.querySelector(".container");
        let direction = 1;
        let position = 0;

        setInterval(() => {
            position += direction * 0.2;
            if (position > 8 || position < -8) direction *= -1;
            container.style.transform = `translateY(${position}px)`;
        }, 20);

        const timeDisplay = document.getElementById("time");

        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = "Local time: " + now.toLocaleTimeString();
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>

</html>
